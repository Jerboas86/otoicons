name: Release

# Push a tag matching the package version (e.g. v0.1.0) to publish to npm and
# attach the symbol bundle to a GitHub release. npm authenticates this workflow
# through trusted publishing (OIDC), so no token is stored in the repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: sudo apt-get install -y fonts-liberation
      - name: Check the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm bundle
      - run: cd bundle && zip -qr "../otoicons-bundle-$GITHUB_REF_NAME.zip" .
      - run: npm publish --provenance --access public
      - run: gh release create "$GITHUB_REF_NAME" "otoicons-bundle-$GITHUB_REF_NAME.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
